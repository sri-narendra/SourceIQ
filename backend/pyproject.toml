[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["..", "."]
addopts = "--cov=services --cov=ai --cov=api --cov=repositories --cov=config --cov=middleware --cov-report=term-missing"
testpaths = ["tests"]